<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skrypty Narzędzia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <header>
      <div class="status-badge status-online" id="script-status">
        <span class="pulse-dot"></span>
        <span class="status-text"> Zaktualizowano 20.06</span>
      </div>
    </header>

    <div class="cards-grid">
      
      <div class="card">
        <h2>🦖 Skrypt (Zakładka)</h2>
        <p>Wystarczy przeciągnąć przycisk na pasek przeglądarki, aby zainstalować narzędzie.</p>
        <div class="button-group">
          <a id="hub-bookmark-btn" class="btn btn-primary" href="javascript:window.__SH_BRANCH='development';fetch('https://raw.githubusercontent.com/alisohub/fc_amazon/refs/heads/development/hub.js').then(r=>r.text()).then(t=>eval(t));">
            📌 Przeciągnij do paska
          </a>
        </div>
      </div>

    </div> 

    <div id="hidden-view-counter">
      <a href="https://www.hitwebcounter.com" target="_blank">
        <img src="https://hitwebcounter.com/counter/counter.php?page=0000000&style=0001&nbdigits=5&type=page&initCount=0" title="Free Counter" alt="web counter" border="0" />
      </a>
    </div>

  </div> 
  
  <script src="skripst/ostre.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
